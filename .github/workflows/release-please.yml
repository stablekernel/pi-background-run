name: Release Please

# Opens/updates the Release PR (package.json version bump + CHANGELOG.md) on every
# push to main. Merging that PR is the release: release-please tags the commit and
# creates the GitHub Release with generated notes.
#
# NO SECRET IS REQUIRED. This runs on GITHUB_TOKEN, and the two things GITHUB_TOKEN
# normally blocks are handled as follows — see docs/releasing.md for the full flow.
#
# 1. Checks on the Release PR. `main` requires `lint-test` and enforce_admins is true,
#    so there is no bypass. GitHub exempts `pull_request` events with the `opened`,
#    `synchronize`, and `reopened` activity types: a PR created by GITHUB_TOKEN gets
#    its runs started in an APPROVAL-REQUIRED state rather than suppressed. A user
#    with write access clicks "Approve workflows to run" in the merge box, `lint-test`
#    reports, and the PR merges normally. Nothing is skipped.
#
# 2. Publishing. `release` is NOT an exempt event, so a Release created here does not
#    fire release.yml's `release: published` trigger — npm would silently not update.
#    Publish with:  gh workflow run release.yml -f dry-run=false
#    (That trigger remains live for Releases created by a person, which is how 0.6.0
#    was published.)
#
# To remove both manual steps, set a RELEASE_PLEASE_TOKEN secret — a token-created
# Release carries a user/App identity, so `release: published` fires and no click is
# needed. Scope it to this repo: contents: write + pull_requests: write. Note a secret
# that exists but is UNAUTHORISED (e.g. a fine-grained PAT still pending org approval)
# short-circuits the `||` fallback below and hard-fails with 403 — delete it instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Mutating workflow — do NOT cancel in progress. Serializing also stops two runs
# from rebasing the same open Release PR against each other.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      # First attempt uses the configured token when present, GITHUB_TOKEN otherwise.
      # continue-on-error so a REJECTED token — expired, revoked, or created but never
      # approved — degrades to the credential-free path instead of blocking releases
      # outright. (Testing for the secret itself is not an option: `secrets` is not an
      # available context in a step `if:`.)
      - name: Release Please
        id: attempt
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Same run, on GITHUB_TOKEN. release-please is idempotent, so a retry after a
      # partial first attempt reuses whatever it already created rather than
      # duplicating it. Release PRs still open here — they just need the approve click,
      # and publishing becomes the manual dispatch. See docs/releasing.md.
      - name: Release Please (fallback to GITHUB_TOKEN)
        if: ${{ steps.attempt.outcome == 'failure' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # FAILS ON PURPOSE. A warning would notify nobody — a failed workflow run is the
      # only signal GitHub pushes out — and this cannot block a release, because the
      # fallback above already did the work and publishing does not depend on this job.
      # Red here means "rotate the token", not "releases are broken".
      - name: Report rejected token
        if: ${{ steps.attempt.outcome == 'failure' }}
        run: |
          {
            echo "## Release token rejected — fell back to GITHUB_TOKEN"
            echo ""
            echo "\`RELEASE_PLEASE_TOKEN\` was rejected, so release-please was retried on"
            echo "\`GITHUB_TOKEN\`. **Releases still work**, but they now need the two manual"
            echo "steps: approve the Release PR's workflow runs, then publish with"
            echo "\`gh workflow run release.yml -f dry-run=false\`."
            echo ""
            echo "To fix: mint a replacement, run \`gh secret set RELEASE_PLEASE_TOKEN\`,"
            echo "then revoke the old token. See \`docs/releasing.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Release token rejected::RELEASE_PLEASE_TOKEN was rejected; fell back to GITHUB_TOKEN, so releases still work via the manual approve + dispatch steps. Rotate the token — see docs/releasing.md."
          exit 1
