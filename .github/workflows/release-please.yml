name: Release Please

# Opens/updates the Release PR (package.json version bump + CHANGELOG.md) on every
# push to main. Merging that PR is the release: release-please tags the commit and
# creates the GitHub Release with generated notes.
#
# NO SECRET IS REQUIRED. This runs on GITHUB_TOKEN, and the two things GITHUB_TOKEN
# normally blocks are handled as follows — see docs/releasing.md for the full flow.
#
# 1. Checks on the Release PR. `main` requires `lint-test` and enforce_admins is true,
#    so there is no bypass. GitHub exempts `pull_request` events with the `opened`,
#    `synchronize`, and `reopened` activity types: a PR created by GITHUB_TOKEN gets
#    its runs started in an APPROVAL-REQUIRED state rather than suppressed. A user
#    with write access clicks "Approve workflows to run" in the merge box, `lint-test`
#    reports, and the PR merges normally. Nothing is skipped.
#
# 2. Publishing. `release` is NOT an exempt event, so a Release created here does not
#    fire release.yml's `release: published` trigger — npm would silently not update.
#    Publish with:  gh workflow run release.yml -f dry-run=false
#    (That trigger remains live for Releases created by a person, which is how 0.6.0
#    was published.)
#
# To remove both manual steps, set a RELEASE_PLEASE_TOKEN secret — a token-created
# Release carries a user/App identity, so `release: published` fires and no click is
# needed. Scope it to this repo: contents: write + pull_requests: write. Note a secret
# that exists but is UNAUTHORISED (e.g. a fine-grained PAT still pending org approval)
# short-circuits the `||` fallback below and hard-fails with 403 — delete it instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Mutating workflow — do NOT cancel in progress. Serializing also stops two runs
# from rebasing the same open Release PR against each other.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Defaults to GITHUB_TOKEN, which is a fully supported path — not a
          # degraded one. It costs one "Approve workflows to run" click on the
          # Release PR and a manual publish dispatch; see the header above.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
