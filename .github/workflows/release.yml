name: Release

# STATE-MUTATING WORKFLOW — publishes to npm (dual publish: pi-bgrun + @stablekernel/pi-bgrun).
# dry-run safety, concurrency serialization, annotations, and summary are all MANDATORY.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + validate + npm publish --dry-run; skip the real publish"
        type: boolean
        default: true

permissions:
  contents: read

# Mutating workflow — do NOT cancel in progress.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}-${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && 'dryrun' || 'real' }}
  cancel-in-progress: false

jobs:
  # ── Gate: CI must pass before we can publish ──────────────────────────────
  verify:
    uses: ./.github/workflows/ci.yml

  # ── Publish (dual: unscoped primary + scoped alias) ───────────────────────
  publish:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # id-token: write is required for npm OIDC trusted publishing (provenance).
      # PREREQUISITE: BOTH npm packages (`pi-bgrun` and `@stablekernel/pi-bgrun`)
      # must have trusted-publisher configurations pointing at this repo + workflow.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
          # Node 24 ships with npm 11.5.1+ which is required for OIDC trusted
          # publishing.

      - name: npm ci
        run: npm ci

      # ── Version-consistency guard ─────────────────────────────────────────
      - name: Verify version consistency
        id: version_check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          echo "pkg_version=${pkg_version}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "release" ]; then
            tag_version="${RELEASE_TAG#v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error title=Version mismatch::Release tag '${RELEASE_TAG}' (${tag_version}) does not match package.json version '${pkg_version}'."
              exit 1
            fi
            echo "::notice::Version check passed — tag ${RELEASE_TAG} matches package.json ${pkg_version}"
          else
            echo "::notice::DRY-RUN — package.json version that would be published: ${pkg_version}"
          fi

      # ── Publish primary (unscoped: pi-bgrun) ──────────────────────────────
      # package.json ships with "name": "pi-bgrun" so the default publish hits the
      # primary. All-or-nothing: a failure here fails the job before the alias step.
      - name: Publish primary (pi-bgrun)
        id: publish_primary
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        env:
          PKG_VERSION: ${{ steps.version_check.outputs.pkg_version }}
        run: |
          npm publish --provenance --access public
          echo "::notice::Published pi-bgrun@${PKG_VERSION} to npm"

      - name: Publish primary dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: npm publish --dry-run --access public

      # ── Publish alias (scoped: @stablekernel/pi-bgrun) ─────────────────────
      # Same tarball, different name. Rewrite package.json's name field, repack.
      # All-or-nothing: if the primary publish succeeded but this fails, the job
      # fails — leaving the primary published without the alias. Acceptable: the
      # primary is the canonical name; the alias is a permanent-namespace nice-to-have.
      - name: Publish alias (@stablekernel/pi-bgrun)
        id: publish_alias
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        env:
          PKG_VERSION: ${{ steps.version_check.outputs.pkg_version }}
        run: |
          node -e "const p=require('./package.json'); p.name='@stablekernel/pi-bgrun'; require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n')"
          npm publish --provenance --access public
          echo "::notice::Published @stablekernel/pi-bgrun@${PKG_VERSION} to npm"

      - name: Publish alias dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          node -e "const p=require('./package.json'); p.name='@stablekernel/pi-bgrun'; require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n')"
          npm publish --dry-run --access public

      # ── Deprecate the alias in favor of the primary ────────────────────────
      # Only on real publish. The alias is a permanent namespace claim; the README
      # and install instructions point at the unscoped primary.
      - name: Deprecate alias
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        env:
          PKG_VERSION: ${{ steps.version_check.outputs.pkg_version }}
        continue-on-error: true
        run: |
          npm deprecate "@stablekernel/pi-bgrun@${PKG_VERSION}" "Use pi-bgrun (the unscoped primary) instead: pi install npm:pi-bgrun"

      - name: Write publish summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          PKG_VERSION: ${{ steps.version_check.outputs.pkg_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRIMARY_OUTCOME: ${{ steps.publish_primary.outcome }}
          ALIAS_OUTCOME: ${{ steps.publish_alias.outcome }}
        run: |
          {
            echo "## Release — ${{ github.workflow }} — ${{ job.status }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${PKG_VERSION}\` |"
            echo "| Event | \`${EVENT_NAME}\` |"
            echo "| Dry-run | \`${IS_DRY_RUN}\` |"
            echo "| Primary publish (pi-bgrun) | \`${PRIMARY_OUTCOME}\` |"
            echo "| Alias publish (@stablekernel/pi-bgrun) | \`${ALIAS_OUTCOME}\` |"
            echo "| Release tag | \`${RELEASE_TAG:-N/A}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
