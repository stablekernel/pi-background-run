name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow as a reusable workflow (its verify job)
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege: read-only repo contents + PR comments for the test report.
permissions:
  contents: read
  pull-requests: write

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Bun-only on purpose: it runs every step below (lint, tests, pack
      # listing), so a Node toolchain here would be dead weight. The one thing a
      # Node job would add is the V8/worker_threads side of bggrep's bounded
      # matching — verified by hand with `node --test extension/index.test.ts`
      # (214 pass, ~20s). Re-run that by hand after touching the bggrep worker.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install --frozen-lockfile

      - name: tsc --noEmit
        id: tsc
        run: |
          bun run lint
          echo "result=passed" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        run: bun test extension/index.test.ts

      # npm, not bun, for THIS step only: the tarball that ships is built by
      # `npm publish` (release.yml, OIDC trusted publishing), so the allowlist
      # must be checked with the packer that actually produces it. npm is
      # preinstalled on the runner — no setup-node, no second toolchain — and
      # today both packers emit the same 7 files; that agreement is what this
      # step is here to keep true.
      - name: npm pack --dry-run (files allowlist sanity)
        id: pack
        run: |
          pack_status=0
          pack_output=$(npm pack --dry-run 2>&1) || pack_status=$?
          echo "$pack_output"
          # sed, not grep -oP: no GNU/BusyBox difference to trip over, and the
          # casing differs between packers ("total files:" vs "Total files:").
          file_count=$(echo "$pack_output" | sed -n 's/.*[Tt]otal files:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | tail -1)
          # npm pack failing, or printing no file count, means the allowlist was
          # never actually checked — the greps below cannot fail on it. Treat
          # that as a failure instead of a green step reporting "? files".
          if [ "$pack_status" -ne 0 ] || [ -z "$file_count" ]; then
            echo "::error::npm pack --dry-run failed (exit ${pack_status}) or printed no file count — allowlist NOT verified"
            exit 1
          fi
          echo "file_count=${file_count}" >> "$GITHUB_OUTPUT"
          # Enforce the allowlist: test files and other non-runtime files must
          # never ship in the published tarball (they bloat installs and leak
          # internals). npm's `files` negation should exclude these; fail loudly
          # if a future edit drops the negation.
          if echo "$pack_output" | grep -qE '(index\.test\.ts|/test/|\.test\.)'; then
            echo "::error::test files found in the published tarball — fix package.json files[]"
            exit 1
          fi

      # Sticky PR comment: one report per PR, updated in place on every run
      # (found via the hidden marker, so comments never stack up).
      - name: PR report comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TSC_RESULT: ${{ steps.tsc.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          PACK_FILES: ${{ steps.pack.outputs.file_count }}
        run: |
          marker="<!-- ci-report:v1 -->"
          body_file=$(mktemp)
          {
            echo "$marker"
            echo "## CI report"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| tsc --noEmit | ${TSC_RESULT} |"
            echo "| tests | ${TESTS_OUTCOME} |"
            echo "| npm pack --dry-run | ${PACK_OUTCOME} (${PACK_FILES} files in tarball) |"
            echo ""
            echo "Ref: \`${HEAD_SHA}\`"
          } > "$body_file"

          comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("'"$marker"'")) | .id' | head -n1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@"$body_file" >/dev/null
            echo "Updated existing comment $comment_id"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$body_file" >/dev/null
            echo "Created new comment"
          fi

      - name: Write run summary
        if: always()
        env:
          TSC_RESULT: ${{ steps.tsc.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          PACK_FILES: ${{ steps.pack.outputs.file_count }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## CI — ${WORKFLOW_NAME} — ${JOB_STATUS}"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| tsc --noEmit | \`${TSC_RESULT}\` |"
            echo "| tests | \`${TESTS_OUTCOME}\` |"
            echo "| npm pack --dry-run | \`${PACK_OUTCOME}\` — ${PACK_FILES} files in tarball |"
            echo ""
            echo "Ref: \`${COMMIT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
